# futures_quant — default configuration.
#
# SAFETY: this file ships in the safe state. Live execution is OFF. Turning it
# on is a deliberate, human-approved, per-phase action — and even when this
# flag is true, the execution router is still a loud stub in Phase 1, so no
# order can actually be sent yet.

mode: backtest          # backtest | paper | live   (only backtest is built)
live_enabled: false     # master switch for routing real orders. Keep false.

instruments:
  - NQ
  - MNQ

data:
  # Directory where per-contract canonical CSVs live (relative to this repo).
  # No data ships in the repo; you drop real exports in locally.
  root: "futures_quant/data/historical"
  bar_interval: "1min"     # 1-minute base; resample up only, never down
  session: "globex"        # full Globex / ETH session
  timezone_canonical: "UTC"
  timestamp_edge: "close"  # canonical bars are stamped at the bar CLOSE

roll:
  policy: "calendar"       # calendar | volume
  # For 'calendar': roll this many exchange business days before expiry.
  calendar_days_before_expiry: 5

risk:
  # Prop-firm overlay parameters (Lucid-style). The overlay itself is a loud
  # stub in Phase 1; these values are carried so they are reviewable now and
  # wired straight in when the overlay is built. The overlay has VETO power.
  max_daily_loss_usd: 1000
  hard_stop_usd: 2000
  max_position_contracts: 3

execution:
  venue: "tradovate"       # tradovate | lucid
  enabled: false           # built but disabled until explicitly turned on
